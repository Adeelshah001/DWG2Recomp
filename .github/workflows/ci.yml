name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check no game data / binaries / personal paths
        run: python scripts/check_no_game_data.py

      - name: Check whitespace and line endings
        run: git diff --check

      - name: Verify launcher builds
        run: powershell -ExecutionPolicy Bypass -File scripts/build-launcher.ps1 -Output .\DWG2R.exe
        shell: pwsh

      - name: Verify launcher CLI checks
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'
          function Invoke-LauncherCheck {
            param(
              [string]$Arguments,
              [int]$ExpectedExit,
              [string]$StdoutPattern,
              [string]$StderrPattern
            )
            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = (Resolve-Path '.\DWG2R.exe').Path
            $psi.Arguments = $Arguments
            $psi.UseShellExecute = $false
            $psi.CreateNoWindow = $true
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            $p = [System.Diagnostics.Process]::Start($psi)
            $outTask = $p.StandardOutput.ReadToEndAsync()
            $errTask = $p.StandardError.ReadToEndAsync()
            if (-not $p.WaitForExit(15000)) {
              try { $p.Kill() } catch {}
              throw "Timed out running DWG2R.exe $Arguments"
            }
            $stdout = $outTask.GetAwaiter().GetResult().Trim()
            $stderr = $errTask.GetAwaiter().GetResult().Trim()
            if ($p.ExitCode -ne $ExpectedExit) {
              throw "DWG2R.exe $Arguments exited $($p.ExitCode), expected $ExpectedExit. stdout='$stdout' stderr='$stderr'"
            }
            if ($StdoutPattern -and ($stdout -notmatch $StdoutPattern)) {
              throw "DWG2R.exe $Arguments stdout mismatch: '$stdout'"
            }
            if ($StderrPattern -and ($stderr -notmatch $StderrPattern)) {
              throw "DWG2R.exe $Arguments stderr mismatch: '$stderr'"
            }
          }
          Invoke-LauncherCheck '--version' 0 '^\d+\.\d+\.\d+(-[A-Za-z0-9.-]+)?$' ''
          Invoke-LauncherCheck '--help' 0 '(?s)DWG2R.*Usage:' ''
          Invoke-LauncherCheck '--invalid-option' 1 '' 'Unknown option'
        shell: pwsh

  # Optional: build the host layer to verify config/compiler.json is sound
  # Requires the pinned SDK and llvm-mingw in the runner cache (not provided here).
