; Dynasty Warriors: Gundam 2 Recomp - player settings
; Edit while the game is closed. Menu changes save back to this file.
; Existing settings are migrated once; originals are retained in user-data/settings-backup/.
; Keep section and key names. Unknown keys and comments survive menu edits.

[graphics]
; Internal rendering/output scale: 1=1280x720, 2=2560x1440, 3=3840x2160.
resolution_scale = 1

[camera]
; 0=Default; 5 to 50 in steps of 5 increases the field of view.
fov_percent = 0

[video]
; 0=Off, 1=On. Uses the existing host VSync option.
vsync = 0
; Remember fullscreen across launches (0=windowed, 1=fullscreen).
fullscreen = 0

[prompts]
; 0=Auto, 1=Xbox, 2=PlayStation.
style = 0
; 0=Off, 1=On. Existing HUD seam correction.
hud_correction = 1

; Controls: primary action and action.alternate are independent bindings.
; Values are kind,code,sign,modifiers. kind: 0=unbound, 1=keyboard,
; 2=SDL standard gamepad button, 3=SDL standard gamepad axis.
; Keyboard code is Windows virtual key: Space=32, Backspace=8, Enter=13,
; Tab=9, Escape=27, arrows=37/38/39/40, A-Z=65-90, 0-9=48-57.
; Gamepad buttons: South=0, East=1, West=2, North=3, Back=4, Start=6,
; L3=7, R3=8, LB=9, RB=10, Up=11, Down=12, Left=13, Right=14, touchpad=20.
; Axes: LeftX=0, LeftY=1, RightX=2, RightY=3, LT=4, RT=5.
; sign: 1=positive, -1=negative axis. modifiers: Shift=1, Ctrl=2, Alt=4;
; add modifiers to combine them. Gamepad modifiers must be 0.
; deadzone is a percentage from 0 through 50.

[controls]
fullscreen_shortcut_schema = 2

